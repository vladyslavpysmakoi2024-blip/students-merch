services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: merch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-merch_shop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-merch_shop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: merch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-merch_shop}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_SSL: disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretjwtkey12345_students_merch_shop}
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_IN_DAYS: "7"
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-your-fallback-secret-key-12345}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
