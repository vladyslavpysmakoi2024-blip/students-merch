services:
  # Local-only DB credentials, fixed on purpose: Postgres applies them only when the volume is first created,
  # so taking them from DATABASE_* (the Neon creds in backend/.env / shell) broke every run after the first.
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: merch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: merch_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: merch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: merch_shop
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_SSL: disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretjwtkey12345_students_merch_shop}
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_IN_DAYS: "7"
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-your-fallback-secret-key-12345}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: docker.io/library/redis:alpine
    container_name: local-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: merch-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
